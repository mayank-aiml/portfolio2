<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Mayank Tiwari — personal links and portfolio coming soon." />
  <title>Mayank Tiwari — Coming Soon</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --line: rgba(0, 0, 0, 0.12);
      --card: rgba(255, 255, 255, 0.76);
      --hover: #f3f3f3;
      --particle: 20, 20, 20;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.06);
    }

    :root.dark {
      color-scheme: dark;
      --bg: #000000;
      --fg: #f5f5f5;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.16);
      --card: rgba(10, 10, 10, 0.78);
      --hover: #171717;
      --particle: 245, 245, 245;
      --shadow: 0 18px 60px rgba(255, 255, 255, 0.025);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color 220ms ease, color 220ms ease;
      overflow-x: hidden;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px 20px 24px;
    }

    .topbar {
      position: absolute;
      top: 24px;
      right: 26px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }
    .theme-toggle:hover { background: var(--hover); transform: translateY(-1px); }
    .theme-toggle:focus-visible, .social-link:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 4px;
    }
    .theme-toggle svg { width: 16px; height: 16px; }

    main {
      width: min(100%, 760px);
      text-align: center;
      padding: 58px 0 36px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 23px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12); }
      50% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0.035); }
    }

    h1 {
      margin: 0;
      font-size: clamp(3.1rem, 10vw, 6.8rem);
      font-weight: 750;
      letter-spacing: -0.085em;
      line-height: 0.98;
    }
    .period { color: var(--muted); }
    .subtitle {
      margin: 25px auto 0;
      max-width: 480px;
      color: var(--muted);
      font-size: clamp(15px, 2.3vw, 18px);
      line-height: 1.75;
    }

    .divider {
      width: 46px;
      height: 1px;
      background: var(--line);
      margin: 32px auto 25px;
    }
    .connect-label {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      font-weight: 650;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--fg);
      text-decoration: none;
      font-size: 14px;
      font-weight: 550;
      box-shadow: var(--shadow);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      backdrop-filter: blur(8px);
    }
    .social-link:hover {
      transform: translateY(-3px);
      background: var(--hover);
      border-color: var(--muted);
    }
    .social-link svg { width: 18px; height: 18px; flex: 0 0 auto; fill: currentColor; }
    .social-link .stroke-icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    footer {
      margin-top: auto;
      padding-top: 26px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .footer-mark { color: var(--fg); font-weight: 650; }

    @media (max-width: 520px) {
      .topbar { top: 16px; right: 16px; }
      .page { padding: 24px 16px 20px; }
      main { padding-top: 65px; }
      .links { gap: 9px; }
      .social-link { flex: 1 1 calc(50% - 9px); min-width: 135px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="page">
    <div class="topbar">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
        </svg>
        <span id="themeText">Light mode</span>
      </button>
    </div>

    <main>
      <div class="eyebrow"><span class="status-dot"></span> Something is in the works</div>
      <h1>Mayank<br />Tiwari<span class="period">.</span></h1>
      <p class="subtitle">
        Building things, learning constantly, and turning ideas into reality.
        <br />A more complete portfolio is coming soon.
      </p>

      <div class="divider"></div>
      <p class="connect-label">Find me around the web</p>

      <nav class="links" aria-label="Social and contact links">
        <a class="social-link" href="https://www.linkedin.com/in/mayank-kailas-tiwari/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.74H4.96V9.2h2.97v9.54ZM6.45 7.9a1.72 1.72 0 1 1 0-3.44 1.72 1.72 0 0 1 0 3.44Zm12.29 10.84h-2.96V14.1c0-1.1-.02-2.52-1.54-2.52-1.55 0-1.79 1.2-1.79 2.44v4.72H9.49V9.2h2.84v1.3h.04c.4-.75 1.36-1.54 2.8-1.54 3 0 3.57 1.97 3.57 4.53v5.25Z"/></svg>
          LinkedIn
        </a>

        <a class="social-link" href="https://github.com/mayank-aiml" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.75-1.32-3.75-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.14 3.15 1.62.1-.72.39-1.22.7-1.5-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.27-2.6 5.22-5.08 5.5.4.35.75 1.02.75 2.06v3.05c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
          GitHub
        </a>

        <a class="social-link" href="https://leetcode.com/u/MayankX/" target="_blank" rel="noopener noreferrer" aria-label="LeetCode profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16.4 17.1 12.8 20.7a5.6 5.6 0 0 1-7.9-7.9l6.4-6.4a5.6 5.6 0 0 1 7.9 0l.9.9-1.9 1.9-.9-.9a2.9 2.9 0 0 0-4.1 0l-6.4 6.4a2.9 2.9 0 0 0 4.1 4.1l3.6-3.6 1.9 1.9Z"/>
            <path d="M9.1 11.4h9.5v2.7H9.1z"/>
            <path d="m14.2 3.4 1.9 1.9-7.8 7.8-1.9-1.9z"/>
          </svg>
          LeetCode
        </a>

        <a class="social-link" href="mailto:mayanktiwarimaurya@gmail.com" aria-label="Send email to Mayank">
          <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
          Email
        </a>

        <a class="social-link" href="https://github.com/mayank-aiml" target="_blank" rel="noopener noreferrer" aria-label="Resume link (currently points to GitHub profile)">
          <svg class="stroke-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg>
          Resume
        </a>
      </nav>
    </main>

    <footer>Designed simply. Built with <span class="footer-mark">HTML, CSS &amp; JavaScript.</span></footer>
  </div>

  <script>
    // Theme toggle with saved preference.
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeText = document.getElementById('themeText');
    const themeIcon = document.getElementById('themeIcon');
    const metaTheme = document.querySelector('meta[name="theme-color"]');

    function applyTheme(theme) {
      const dark = theme === 'dark';
      root.classList.toggle('dark', dark);
      themeText.textContent = dark ? 'Dark mode' : 'Light mode';
      themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      metaTheme.setAttribute('content', dark ? '#000000' : '#ffffff');
      themeIcon.innerHTML = dark
        ? '<path d="M20.8 13A8.7 8.7 0 0 1 11 3.2 8.8 8.8 0 1 0 20.8 13Z"></path>'
        : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>';
      try { localStorage.setItem('mayank-theme', theme); } catch (_) {}
    }

    let savedTheme = null;
    try { savedTheme = localStorage.getItem('mayank-theme'); } catch (_) {}
    applyTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    themeToggle.addEventListener('click', () => {
      applyTheme(root.classList.contains('dark') ? 'light' : 'dark');
    });

    // Lightweight animated particles: no library required.
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let width = 0, height = 0, particles = [], animationId = null;
    const pointer = { x: -1000, y: -1000 };

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(75, Math.max(28, Math.floor((width * height) / 18000)));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.34,
        vy: (Math.random() - 0.5) * 0.34,
        r: Math.random() * 1.5 + 0.5
      }));
      if (reduceMotion) drawParticles(true);
    }

    function drawParticles(staticFrame = false) {
      ctx.clearRect(0, 0, width, height);
      const rgb = getComputedStyle(root).getPropertyValue('--particle').trim() || '20, 20, 20';
      const linkDistance = 115;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (!staticFrame) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < -5) p.x = width + 5;
          if (p.x > width + 5) p.x = -5;
          if (p.y < -5) p.y = height + 5;
          if (p.y > height + 5) p.y = -5;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${rgb}, ${root.classList.contains('dark') ? 0.62 : 0.42})`;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const q = particles[j];
          const dx = p.x - q.x;
          const dy = p.y - q.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < linkDistance) {
            const opacity = (1 - distance / linkDistance) * (root.classList.contains('dark') ? 0.17 : 0.12);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = `rgba(${rgb}, ${opacity})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
        }
      }
      if (!staticFrame && !document.hidden && !reduceMotion) {
        animationId = requestAnimationFrame(() => drawParticles(false));
      }
    }

    function startAnimation() {
      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
      drawParticles(reduceMotion);
    }

    window.addEventListener('resize', () => { resizeCanvas(); startAnimation(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (animationId) cancelAnimationFrame(animationId);
        animationId = null;
      } else {
        startAnimation();
      }
    });
    window.addEventListener('pointermove', (event) => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
    }, { passive: true });

    resizeCanvas();
    startAnimation();
  </script>
</body>
</html>
